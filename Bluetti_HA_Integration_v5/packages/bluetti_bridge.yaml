input_select:
  bluetti_bridge_datenquelle:
    name: Bluetti Bridge Datenquelle
    options:
      - MQTT
      - HTTP
    initial: MQTT
    icon: mdi:swap-horizontal

input_number:
  bluetti_bridge_unavailable_timeout:
    name: Bluetti Timeout bis nicht verfügbar
    icon: mdi:timer-alert-outline
    min: 10
    max: 300
    step: 5
    initial: 60
    unit_of_measurement: s
    mode: slider

rest:
  - resource: !secret bluetti_bridge_api_url
    scan_interval: 5
    timeout: 4
    sensor:
      - name: Bluetti Bridge HTTP Status
        unique_id: bluetti_bridge_http_status_v2
        value_template: "{{ value_json.error_code | default(99) }}"
        json_attributes:
          - error_code
          - timestamp_ms
          - round_active
          - data
          - bluetooth_query_delay_ms
          - mqtt_connected
          - bluetooth_connected

rest_command:
  bluetti_bridge_command_http:
    url: !secret bluetti_bridge_command_url
    method: POST
    content_type: "application/json"
    payload: '{"name":"{{ name }}","value":"{{ value }}"}'

automation:
  - id: bluetti_bridge_mqtt_router_v2
    alias: "Bluetti Bridge – dynamischer MQTT-Router"
    description: "Liest nur Statusmeldungen der in input_text.bluetti_id gewählten Bridge."
    mode: queued
    max: 100
    triggers:
      - trigger: mqtt
        topic: "bluetti/+/state/#"
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.topic.split('/') | length >= 4
             and trigger.topic.split('/')[0] == 'bluetti'
             and trigger.topic.split('/')[1] == states('input_text.bluetti_id')
             and trigger.topic.split('/')[2] == 'state' }}
    actions:
      - variables:
          bluetti_field: "{{ trigger.topic.split('/')[3] }}"
          bluetti_payload: "{{ trigger.payload | string }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ bluetti_field == 'error_code' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.bluetti_mqtt_error_code
                data:
                  value: "{{ bluetti_payload }}"
          - conditions:
              - condition: template
                value_template: >-
                  {{ bluetti_field == 'timestamp_ms'
                     and (bluetti_payload | int(0)) > 0 }}
            sequence:
              # Keep the last known successful timestamp. Ignore empty/zero
              # timestamps so a transient status publication cannot make all
              # measurement entities unavailable.
              - action: input_text.set_value
                target:
                  entity_id: input_text.bluetti_mqtt_timestamp_ms
                data:
                  value: "{{ bluetti_payload | int }}"
          - conditions:
              - condition: template
                value_template: "{{ bluetti_field == 'ac_output_on' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.bluetti_mqtt_ac_output_on
                data:
                  value: "{{ bluetti_payload }}"
