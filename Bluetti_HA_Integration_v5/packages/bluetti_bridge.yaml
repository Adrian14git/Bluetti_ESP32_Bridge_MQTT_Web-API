template:
  - sensor:
      - name: Bluetti Bridge Fehlercode
        unique_id: bluetti_bridge_error_code_v2
        icon: mdi:alert-circle-outline
        state: >-
          {% if is_state('input_select.bluetti_bridge_datenquelle', 'HTTP') %}
            {{ state_attr('sensor.bluetti_bridge_http_status', 'error_code') | int(99) }}
          {% else %}
            {{ states('input_text.bluetti_mqtt_error_code') | int(99) }}
          {% endif %}
      - name: Bluetti Bridge Zeitstempel
        unique_id: bluetti_bridge_timestamp_ms_v2
        icon: mdi:clock-check-outline
        unit_of_measurement: ms
        state_class: measurement
        state: >-
          {% if is_state('input_select.bluetti_bridge_datenquelle', 'HTTP') %}
            {{ state_attr('sensor.bluetti_bridge_http_status', 'timestamp_ms') | int(0) }}
          {% else %}
            {{ states('input_text.bluetti_mqtt_timestamp_ms') | int(0) }}
          {% endif %}
      - name: "Bluetti AC-Ausgangsmodus"
        unique_id: bluetti_ac_output_mode_sensor_v1
        icon: mdi:state-machine
        state: >-
          {% if is_state('input_select.bluetti_bridge_datenquelle', 'HTTP') %}
            {% set d = state_attr('sensor.bluetti_bridge_http_status', 'data') %}
            {% set raw = d.get('ac_output_mode', 'unknown') if d is mapping else 'unknown' %}
          {% else %}
            {% set raw = states('input_text.bluetti_mqtt_ac_output_mode') %}
          {% endif %}
          {% set v = raw | string | upper | trim %}
          {% set v = v.split('.')[-1] %}
          {% if v in ['0', 'STOP'] %}Stopp
          {% elif v in ['1', 'INVERTER_OUTPUT'] %}Wechselrichter-Ausgang
          {% elif v in ['2', 'BYPASS_OUTPUT_C'] %}Bypass-Ausgang C
          {% elif v in ['3', 'BYPASS_OUTPUT_D'] %}Bypass-Ausgang D
          {% elif v in ['4', 'LOAD_MATCHING'] %}Lastanpassung
          {% else %}Unbekannt{% endif %}
        attributes:
          rohwert: >-
